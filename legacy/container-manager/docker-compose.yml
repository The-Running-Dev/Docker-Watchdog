x-defaultEnvironment: &defaultEnvironment
  PUID: 1000
  PGID: 100
  UMASK: 002
  TZ: Etc/UTC

x-commonKeys: &commonOptions
  restart: unless-stopped
  stdin_open: true
  tty: true

x-dnsServers: &dnsServers
  dns:
    - 45.90.28.29
    - 45.90.30.29

services:
  docker-webhooks:
    container_name: docker-webhooks
    image: docker-webhooks:latest
    environment:
      <<: *defaultEnvironment
    ports:
      - 4000:4000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    <<: [*dnsServers, *commonOptions]

  mongo:
    container_name: mongo
    image: mongo:latest
    environment:
      <<: *defaultEnvironment
      MONGO_INITDB_ROOT_USERNAME: ${MongoUser}
      MONGO_INITDB_ROOT_PASSWORD: ${MongoPassword}
    ports:
      - 27017:27017
    volumes:
      - ./mongo-data:/data/db
    <<: [*dnsServers, *commonOptions]
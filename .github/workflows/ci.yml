name: Container-CI

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  packages: write
  contents: write

jobs:
  Container-CI:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/the-running-dev/build-agent:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Container CI
        run: container-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RepositoryToken: ${{ secrets.GITHUBPACKAGESTOKEN }}
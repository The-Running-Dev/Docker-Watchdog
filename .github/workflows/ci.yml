name: Container CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'

permissions:
  packages: write
  contents: write

jobs:
  Container:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/the-running-dev/build-agent:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Container CI
        run: docker-ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PackagesToken: ${{ secrets.GITHUBPACKAGESTOKEN }}
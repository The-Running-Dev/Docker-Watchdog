name: Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**'

permissions:
  packages: write

jobs:
  Build-and-Push:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/the-running-dev/build-agent:latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Build and Push
        run: pwsh ./build.ps1
        env:
          gitHubPackagesToken: ${{ secrets.GITHUBPACKAGESTOKEN }}